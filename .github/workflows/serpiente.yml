# Serpiente del calendario de contribuciones (Platane/snk), en los colores de Kualki.
# Corre cada día, al hacer push a main y a mano (Actions > Serpiente > Run workflow).
# Publica serpiente-oscura.svg y serpiente-clara.svg en la rama «output», que el README muestra con <picture>.
# Usa solo el GITHUB_TOKEN del propio workflow (permiso de escritura en el contenido del repo); ninguna clave más.
name: Serpiente

on:
  schedule:
    - cron: "0 6 * * *"   # todos los días a las 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: serpiente
  cancel-in-progress: true

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generar la serpiente (oscura y clara)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/serpiente-oscura.svg?palette=github-dark&color_snake=#FF7A2F&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            dist/serpiente-clara.svg?palette=github-light&color_snake=#FF7A2F&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Serpiente del día"
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
