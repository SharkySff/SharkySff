<svg xmlns="http://www.w3.org/2000/svg" width="860" height="180" viewBox="0 0 860 180" role="img" aria-label="Cómo trabajamos: 01 Entender, 02 Diseñar, 03 Construir">
  <title>Cómo trabajamos: 01 Entender · 02 Diseñar · 03 Construir</title>
  <style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  .progreso { stroke-dasharray: 600; stroke-dashoffset: 600; animation: avanza 7s cubic-bezier(.45,0,.25,1) infinite; }
  @keyframes avanza {
    0%, 6% { stroke-dashoffset: 600; opacity: 1; }
    66% { stroke-dashoffset: 0; opacity: 1; }
    86% { stroke-dashoffset: 0; opacity: 1; }
    96%, 100% { stroke-dashoffset: 0; opacity: 0; }
  }

  .n0 { animation: n0 7s ease-in-out infinite; }
  @keyframes n0 {
    0%, 4% { fill: #F3EBDD; stroke: #E3D6C0; }
    9%, 88% { fill: #FF7A2F; stroke: #FF7A2F; }
    97%, 100% { fill: #F3EBDD; stroke: #E3D6C0; }
  }
  .h0 { transform-origin: 130px 34px; animation: h0 7s ease-out infinite; }
  @keyframes h0 {
    0%, 6% { transform: scale(1); opacity: 0; }
    7% { transform: scale(1); opacity: .55; }
    20%, 100% { transform: scale(2.6); opacity: 0; }
  }
  .t0 { animation: t0 7s ease-in-out infinite; }
  @keyframes t0 {
    0%, 4% { opacity: .55; }
    10%, 88% { opacity: 1; }
    97%, 100% { opacity: .55; }
  }

  .n1 { animation: n1 7s ease-in-out infinite; }
  @keyframes n1 {
    0%, 34% { fill: #F3EBDD; stroke: #E3D6C0; }
    39%, 88% { fill: #FF7A2F; stroke: #FF7A2F; }
    97%, 100% { fill: #F3EBDD; stroke: #E3D6C0; }
  }
  .h1 { transform-origin: 430px 34px; animation: h1 7s ease-out infinite; }
  @keyframes h1 {
    0%, 36% { transform: scale(1); opacity: 0; }
    37% { transform: scale(1); opacity: .55; }
    50%, 100% { transform: scale(2.6); opacity: 0; }
  }
  .t1 { animation: t1 7s ease-in-out infinite; }
  @keyframes t1 {
    0%, 34% { opacity: .55; }
    40%, 88% { opacity: 1; }
    97%, 100% { opacity: .55; }
  }

  .n2 { animation: n2 7s ease-in-out infinite; }
  @keyframes n2 {
    0%, 64% { fill: #F3EBDD; stroke: #E3D6C0; }
    69%, 88% { fill: #FF7A2F; stroke: #FF7A2F; }
    97%, 100% { fill: #F3EBDD; stroke: #E3D6C0; }
  }
  .h2 { transform-origin: 730px 34px; animation: h2 7s ease-out infinite; }
  @keyframes h2 {
    0%, 66% { transform: scale(1); opacity: 0; }
    67% { transform: scale(1); opacity: .55; }
    80%, 100% { transform: scale(2.6); opacity: 0; }
  }
  .t2 { animation: t2 7s ease-in-out infinite; }
  @keyframes t2 {
    0%, 64% { opacity: .55; }
    70%, 88% { opacity: 1; }
    97%, 100% { opacity: .55; }
  }

  @media (prefers-reduced-motion: reduce) {
    .progreso { animation: none; stroke-dashoffset: 0; }
    [class^="n"], [class^="t"] { animation: none; opacity: 1; }
    [class^="h"] { animation: none; opacity: 0; }
  }
</style>
  <line x1="130" y1="34" x2="730" y2="34" stroke="#E3D6C0" stroke-width="3" stroke-linecap="round"/>
  <line class="progreso" x1="130" y1="34" x2="730" y2="34" stroke="#FF7A2F" stroke-width="3" stroke-linecap="round"/>
    <circle class="h0" cx="130" cy="34" r="9" fill="none" stroke="#FF7A2F" stroke-width="2"/>
  <circle class="n0" cx="130" cy="34" r="9" stroke-width="2.5" fill="#F3EBDD" stroke="#E3D6C0"/>
  <circle class="h1" cx="430" cy="34" r="9" fill="none" stroke="#FF7A2F" stroke-width="2"/>
  <circle class="n1" cx="430" cy="34" r="9" stroke-width="2.5" fill="#F3EBDD" stroke="#E3D6C0"/>
  <circle class="h2" cx="730" cy="34" r="9" fill="none" stroke="#FF7A2F" stroke-width="2"/>
  <circle class="n2" cx="730" cy="34" r="9" stroke-width="2.5" fill="#F3EBDD" stroke="#E3D6C0"/>
    <g class="t0">
    <text class="mono" x="130" y="82" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="2" fill="#FF7A2F">01</text>
    <text class="sans" x="130" y="114" text-anchor="middle" font-size="23" font-weight="700" fill="#1D2766">Entender</text>
    <text class="sans" x="130" y="142" text-anchor="middle" font-size="14.5" fill="#5B6290">El negocio y quien lo va a usar.</text>
  </g>
  <g class="t1">
    <text class="mono" x="430" y="82" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="2" fill="#FF7A2F">02</text>
    <text class="sans" x="430" y="114" text-anchor="middle" font-size="23" font-weight="700" fill="#1D2766">Diseñar</text>
    <text class="sans" x="430" y="142" text-anchor="middle" font-size="14.5" fill="#5B6290">La experiencia, antes que el código.</text>
  </g>
  <g class="t2">
    <text class="mono" x="730" y="82" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="2" fill="#FF7A2F">03</text>
    <text class="sans" x="730" y="114" text-anchor="middle" font-size="23" font-weight="700" fill="#1D2766">Construir</text>
    <text class="sans" x="730" y="142" text-anchor="middle" font-size="14.5" fill="#5B6290">A la medida, hasta el último detalle.</text>
  </g>
</svg>
